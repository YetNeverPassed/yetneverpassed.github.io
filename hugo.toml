baseURL = "https://yetneverpassed.github.io/"
title = "未尝往"
languageCode = "zh-cn"
DefaultContentLanguage = "zh"
theme = "paper"
enableInlineShortcodes = true
ignoreErrors = ["error-remote-getjson"]

[pagination]
  pagerSize = 10

[params]
  color = 'linen'
  github = 'YetNeverPassed'
  avatar = ''
  name = '未尝往'
  bio = '逝者如斯，而未尝往也；盈虚者如彼，而卒莫消长也。'

  [params.giscus]
    repo = 'YetNeverPassed/yetneverpassed.github.io'
    repoId = 'R_kgDOTmOV3A'
    category = 'Announcements'
    categoryId = 'DIC_kwDOTmOV3M4DCK7Q'
    mapping = 'pathname'
    strict = '0'
    reactionsEnabled = '1'
    emitMetadata = '0'
    inputPosition = 'bottom'
    theme = 'https://yetneverpassed.github.io/giscus-linen.css'
    lang = 'zh-CN'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true

[outputs]
  home = ["HTML", "RSS"]
