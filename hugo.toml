baseURL = "https://yetneverpassed.github.io/"
title = "未尝往"
languageCode = "zh-cn"
DefaultContentLanguage = "zh"
theme = "paper"
enableInlineShortcodes = true
ignoreErrors = ["error-remote-getjson"]

[pagination]
  pagerSize = 10

[params]
  color = 'linen'
  github = 'YetNeverPassed'
  avatar = ''
  name = '未尝往'
  bio = ''

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true

[menu]
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 10

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]
