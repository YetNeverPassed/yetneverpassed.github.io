{{ define "main" }}
<section class="wrap tags-page">
<header class="page-head"><h1>{{ .Title }}</h1><p>共 {{ len .RegularPages }} 篇文章。</p></header>
<div class="tag-cloud"><a class="tag-chip" href="{{ .Parent.RelPermalink }}">全部标签</a><span class="tag-chip selected">{{ .Title }}</span></div>
{{ $pager := .Paginate .RegularPages.ByDate.Reverse }}<div class="article-list">{{ range $pager.Pages }}{{ partial "pine-card.html" . }}{{ else }}<p class="empty-state">这个标签暂时没有文章。</p>{{ end }}</div>{{ partial "pine-pagination.html" $pager }}
</section>
{{ end }}
