{{ define "main" }}
<section class="wrap"><header class="page-head"><h1>关于{{ site.Title }}</h1></header><div class="about-sheet"><blockquote>{{ range $i, $part := split site.Params.bio "；" }}{{ if $i }}；<br>{{ end }}{{ $part }}{{ end }}</blockquote>{{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}<div class="about-links">{{ with site.Params.github }}<a href="https://github.com/{{ . }}" target="_blank" rel="noopener noreferrer">GitHub ↗</a>{{ end }}{{ with site.Home.OutputFormats.Get "RSS" }}<a href="{{ .RelPermalink }}">RSS ↗</a>{{ end }}</div></div></section>
{{ end }}
