<article class="post-card">
<div class="row-meta"><span>文章</span>{{ if not .Date.IsZero }}<time class="date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006 年 1 月 2 日" }}</time>{{ end }}{{ if .Draft }}<span class="badge">草稿</span>{{ end }}{{ with .GetTerms "tags" }}<div class="tag-set">{{ range . }}<a class="tag" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}</div>{{ end }}</div>
<div class="row-title"><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><span class="row-arrow" aria-hidden="true">↗</span></div>
</article>
